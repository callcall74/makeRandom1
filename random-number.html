<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 숫자 생성기</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --border: #d1d5db;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --border: #334155;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 1.5rem;
      text-align: center;
    }

    .result {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border: 2px dashed var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
      padding: 12px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .result-number {
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      transition: transform 0.15s ease;
    }

    .result-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px 12px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      text-align: center;
      width: 100%;
    }

    .result-list-item {
      padding: 4px;
      word-break: keep-all;
      white-space: nowrap;
    }

    .result-list-separator {
      grid-column: 1 / -1;
      height: 12px;
    }

    .placeholder {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }

    input[type="number"]:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .options {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    .error {
      color: #dc2626;
      font-size: 0.9rem;
      min-height: 1.2em;
      margin-bottom: 10px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:hover { background: var(--accent-hover); }

    #generate {
      flex: 2;
      padding: 18px;
      font-size: 1.3rem;
    }

    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    button.secondary:hover {
      background: var(--accent);
      color: #fff;
    }

    .history {
      margin-top: 24px;
    }

    .history h2 {
      font-size: 1rem;
      margin: 0 0 8px;
      color: var(--muted);
    }

    .history ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 160px;
      overflow-y: auto;
    }

    .history li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
    }

    .history li span:last-child {
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 360px) {
      .result-number { font-size: 3rem; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🎲 랜덤 숫자 생성기</h1>

    <div class="result" id="result">
      <span class="placeholder" id="placeholder">버튼을 눌러 숫자를 생성하세요</span>
    </div>

    <div class="row">
      <div>
        <label for="min">최소값</label>
        <input type="number" id="min" value="30000" step="1">
      </div>
      <div>
        <label for="max">최대값</label>
        <input type="number" id="max" value="50000" step="1">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="count">생성 개수</label>
        <input type="number" id="count" value="20" min="1" max="100" step="1">
      </div>
      <div class="options" style="margin-top: 22px;">
        <input type="checkbox" id="unique" checked>
        <label for="unique" style="margin:0; color: var(--text);">중복 제외</label>
      </div>
    </div>

    <div class="error" id="error"></div>

    <div class="buttons">
      <button id="generate">생성</button>
      <button class="secondary" id="copy">복사</button>
    </div>

    <section class="history">
      <h2>최근 기록</h2>
      <ul id="history"></ul>
    </section>
  </main>

  <script>
    const minInput = document.getElementById("min");
    const maxInput = document.getElementById("max");
    const countInput = document.getElementById("count");
    const uniqueInput = document.getElementById("unique");
    const resultEl = document.getElementById("result");
    const errorEl = document.getElementById("error");
    const historyEl = document.getElementById("history");
    const generateBtn = document.getElementById("generate");
    const copyBtn = document.getElementById("copy");

    let lastResult = null;

    // 최소~최대 범위에서 무작위 정수 하나를 반환 (양 끝 포함)
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generate() {
      errorEl.textContent = "";

      const min = Number(minInput.value);
      const max = Number(maxInput.value);
      const count = Number(countInput.value);
      const unique = uniqueInput.checked;

      if (!Number.isInteger(min) || !Number.isInteger(max)) {
        errorEl.textContent = "최소값과 최대값은 정수로 입력해주세요.";
        return;
      }
      if (min > max) {
        errorEl.textContent = "최소값은 최대값보다 클 수 없습니다.";
        return;
      }
      if (!Number.isInteger(count) || count < 1) {
        errorEl.textContent = "생성 개수는 1 이상의 정수여야 합니다.";
        return;
      }
      const rangeSize = max - min + 1;
      if (unique && count > rangeSize) {
        errorEl.textContent = `중복 제외 시 최대 ${rangeSize}개까지 생성할 수 있습니다.`;
        return;
      }

      const numbers = [];
      if (unique) {
        // 범위의 숫자를 섞은 뒤 앞에서부터 뽑기 (Fisher-Yates 부분 셔플)
        const pool = Array.from({ length: rangeSize }, (_, i) => min + i);
        for (let i = 0; i < count; i++) {
          const j = i + Math.floor(Math.random() * (pool.length - i));
          [pool[i], pool[j]] = [pool[j], pool[i]];
          numbers.push(pool[i]);
        }
      } else {
        for (let i = 0; i < count; i++) {
          numbers.push(randomInt(min, max));
        }
      }

      // 10개씩 2줄 띄운 형식으로 저장 (복사용)
      let formattedResult = "";
      for (let i = 0; i < numbers.length; i++) {
        if (i > 0 && i % 10 === 0) {
          formattedResult += "\n\n";
        } else if (i > 0) {
          formattedResult += ", ";
        }
        formattedResult += numbers[i];
      }
      lastResult = formattedResult.trim();
      showResult(numbers);
      addHistory(numbers.join(", "), `${min} ~ ${max}`);
    }

    function showResult(numbers) {
      resultEl.innerHTML = "";
      if (numbers.length === 1) {
        const el = document.createElement("div");
        el.className = "result-number";
        el.textContent = numbers[0];
        resultEl.appendChild(el);
      } else {
        const el = document.createElement("div");
        el.className = "result-list";
        // 각 숫자를 item으로 추가하고, 10개마다 separator 추가
        for (let i = 0; i < numbers.length; i++) {
          const item = document.createElement("span");
          item.className = "result-list-item";
          item.textContent = numbers[i];
          el.appendChild(item);

          // 10개마다 separator 추가 (마지막이 아닐 때) - 5개 열이므로 2줄(10개)마다
          if ((i + 1) % 10 === 0 && i + 1 < numbers.length) {
            const separator = document.createElement("div");
            separator.className = "result-list-separator";
            el.appendChild(separator);
          }
        }
        resultEl.appendChild(el);
      }
    }

    function addHistory(text, range) {
      const li = document.createElement("li");
      const left = document.createElement("span");
      left.textContent = text;
      const right = document.createElement("span");
      right.textContent = range;
      li.append(left, right);
      historyEl.prepend(li);
      while (historyEl.children.length > 20) {
        historyEl.lastElementChild.remove();
      }
    }

    async function copyResult() {
      if (!lastResult) {
        errorEl.textContent = "먼저 숫자를 생성해주세요.";
        return;
      }
      try {
        await navigator.clipboard.writeText(lastResult);
        copyBtn.textContent = "복사됨!";
      } catch (e) {
        errorEl.textContent = "클립보드 복사에 실패했습니다.";
        return;
      }
      setTimeout(() => (copyBtn.textContent = "복사"), 1200);
    }

    generateBtn.addEventListener("click", generate);
    copyBtn.addEventListener("click", copyResult);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && document.activeElement.tagName !== "BUTTON") {
        generate();
      }
    });
  </script>
</body>
</html>
